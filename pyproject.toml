[project]
name = "sec-financial-rag"
version = "0.1.0"
description = "Production-grade financial RAG pipeline over SEC 10-K and 10-Q filings with citations and measured ablations"
readme = "README.md"
authors = [
    { name = "Vipul-arora-K", email = "87521321+Vipul-arora-K@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "docling==2.142.1",
    "fastapi==0.143.0",
    "fastembed==0.9.1",
    "google-genai==2.33.0",
    "httpx==0.28.1",
    "lxml==6.1.3",
    "modal==1.6.2",
    "numpy==2.5.4",
    "psycopg[binary]==3.3.6",
    "qdrant-client==1.20.0",
    "sentence-transformers==6.2.0",
    "tiktoken==0.14.0",
    "uvicorn==0.54.0",
]

[project.scripts]
sec-financial-rag = "sec_financial_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff>=0.17.1",
]
exp-f = [
    "llama-index-core==0.14.25",
    "llama-index-readers-docling==0.5.0",
    "llama-index-vector-stores-qdrant==0.10.4",
]

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU-only, locked versions)
        run: uv sync --locked --group exp-f
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Unit tests
        # Tests that need Qdrant, Postgres, Gemini or Modal skip without them.
        run: uv run pytest -q
